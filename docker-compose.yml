services:
  postgres:
    image: postgres:16-alpine
    container_name: annual-declaration-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: auth-flow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d auth-flow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
